name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

# 同一分支上的新提交自动取消旧任务，节省 CI 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # 2026-10 Node 安全公告的 24 线修复线；低于此版本不要跑 CI 或构建发布产物。
  NODE_VERSION: 24.22.1

jobs:
  verify:
    name: Lint · Format · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Content validation
        run: npm run validate:content

      - name: Check edgeone.json keeps maxDuration=120
        run: node -e "const c=require('./edgeone.json');if(c.nodeFunctionsConfig?.maxDuration!==120){console.error('edgeone.json 必须保留 nodeFunctionsConfig.maxDuration=120');process.exit(1)}"

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # 判断这次改动是否值得跑浏览器冒烟。
  # 只改文档 / 只改题库 JSON / 只改 e2e 自身的 PR 跳过 e2e；其余一律跑，
  # 尤其是 lib / hooks / app / components / types —— 这些是冒烟的主要目标，不能排除。
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether browser smoke is needed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git show --name-only --pretty=format: "${{ github.sha }}")
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi

          # 空改动（比如只有 tag/手动触发）按「要跑」处理，宁可多跑一次。
          if [ -z "$CHANGED" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              # 文档
              docs/*|*.md) ;;
              # 题库 JSON（content 下的 TS 索引/校验仍算代码，会跑冒烟）
              content/*.json|content/*/*.json) ;;
              # e2e 用例自身
              e2e/*) ;;
              *) NEED=1 ;;
            esac
          done <<< "$CHANGED"

          if [ "$NEED" = "1" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # 浏览器冒烟：单测打到的是服务端与纯函数层，React 页面是盲区。
  # 已经咬过三口（单选题点不动 / duel 第 2 回合起选项永久禁用 / 多选确认作答静默失败），
  # 全部是"verify 全绿但玩家玩不了"。判据见 docs/TESTING.md §5.4。
  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.e2e == 'true'
    env:
      # 与 playwright.config.ts 的 webServer.env 指向同一个目录：
      # 下面的 build 写这里，next start 读这里。
      NEXT_DIST_DIR: .next-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # 跑构建产物而不是 next dev：dev 的首个请求要先编译，冷启动 runner 上
      # duel 首个选项可能在 40s 内不可见（历史 flaky）。next start 起来即就绪。
      - name: Build for e2e
        run: npm run build

      - name: Run e2e smoke
        run: npm run test:e2e

      # 失败时把报告与 trace 留成产物，否则线上翻车只能靠日志尾部猜
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
